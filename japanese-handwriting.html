<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tenarai Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Figtree:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow notebook column; each question is a sheet with a prompt on top and 田字格 practice boxes below. */
:root{
  --paper:#f4f6f1; --sheet:#ffffff; --ink:#1e2433; --muted:#5d6474; --line:#dfe4dc;
  --grid:#8fbfae; --grid-faint:#c7e0d6; --accent:#2f4a8a; --accent-soft:#e6ebf6;
  --shu:#cf3b2b; --shu-soft:#fbe9e6; --ghost:rgba(30,36,51,.13); --pen:#1e2433;
  --f-jp:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-ui:"Figtree","Segoe UI",system-ui,sans-serif;
  --box:clamp(64px,19vw,96px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#13161c; --sheet:#1b1f27; --ink:#e7e9ef; --muted:#9aa1b0; --line:#2b313c;
    --grid:#3f7363; --grid-faint:#2a4a40; --accent:#93abea; --accent-soft:#232c42;
    --shu:#ff6b57; --shu-soft:#3a2220; --ghost:rgba(231,233,239,.16); --pen:#eef0f5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#13161c; --sheet:#1b1f27; --ink:#e7e9ef; --muted:#9aa1b0; --line:#2b313c;
  --grid:#3f7363; --grid-faint:#2a4a40; --accent:#93abea; --accent-soft:#232c42;
  --shu:#ff6b57; --shu-soft:#3a2220; --ghost:rgba(231,233,239,.16); --pen:#eef0f5;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:780px;margin:0 auto;padding:28px 16px 64px;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
header{display:flex;flex-direction:column;gap:14px}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-jp);font-weight:600;font-size:2.1rem;line-height:1.1;margin:0;letter-spacing:.04em;text-wrap:balance}
h1 small{display:block;font-family:var(--f-ui);font-weight:400;font-size:.8rem;color:var(--muted);letter-spacing:.02em;margin-top:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--sheet)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--sheet);font-weight:500}
.datebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.datebar .date{font-size:1.2rem;font-weight:600;min-width:0}
.icon-btn{border:1px solid var(--line);background:var(--sheet);border-radius:8px;width:34px;height:34px;display:inline-grid;place-items:center;padding:0}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.text-btn{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:5px 12px;font-size:.85rem}
.progress{margin-left:auto;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.progress b{color:var(--ink)}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:0;position:relative;min-height:62px}
.day .wd{font-size:.75rem;letter-spacing:.04em;color:var(--muted)}
.day .dn{font-weight:500;font-variant-numeric:tabular-nums}
.day.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day .mk{height:14px;display:grid;place-items:center}
.day .mk svg{width:22px;height:22px;margin-top:-4px}
.day .dot{width:6px;height:6px;border-radius:50%;background:var(--grid)}

/* Question sheet */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px;position:relative}
.q-head{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.q-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.q-no{font-size:.75rem;letter-spacing:.12em;color:var(--muted)}
.q-ask{font-size:.85rem;color:var(--accent);font-weight:500}
.q-big{font-family:var(--f-jp);font-size:2rem;font-weight:600;line-height:1.25;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.q-mean{color:var(--muted)}
.speak{border:0;background:var(--accent-soft);color:var(--accent);border-radius:50%;width:32px;height:32px;display:inline-grid;place-items:center;padding:0}
.speak svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{border:1px solid var(--line);background:none;border-radius:8px;padding:5px 11px;font-size:.84rem}
.tool[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

.rows{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.row-label{writing-mode:vertical-rl;transform:rotate(180deg);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);flex:none}
.boxes{display:flex;flex-wrap:wrap;gap:0;min-width:0}
.box{width:var(--box);height:var(--box);position:relative;border:1.5px solid var(--grid);margin:0 -1.5px -1.5px 0;touch-action:none;
  background:
    linear-gradient(var(--grid-faint),var(--grid-faint)) center/100% 1px no-repeat,
    linear-gradient(var(--grid-faint),var(--grid-faint)) center/1px 100% no-repeat;}
.box::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,var(--sheet) 0 3px,transparent 3px 6px) center/100% 1px no-repeat,
             repeating-linear-gradient(0deg,var(--sheet) 0 3px,transparent 3px 6px) center/1px 100% no-repeat}
.box .ghost{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-jp);font-size:calc(var(--box)*.78);line-height:1;color:var(--ghost);user-select:none;pointer-events:none;z-index:1}
.box canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;cursor:crosshair}

.answer{border-top:1px dashed var(--line);padding-top:12px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.answer .a-word{font-family:var(--f-jp);font-size:2.6rem;line-height:1.2}
.answer ruby rt{font-size:.38em;color:var(--muted)}
.answer .a-meta{color:var(--muted);font-size:.9rem;min-width:0}
.grade{display:flex;gap:8px;margin-left:auto}
.grade button{border:1px solid var(--line);background:none;border-radius:8px;padding:6px 12px;font-size:.88rem}
.grade .ok{border-color:var(--shu);color:var(--shu)}
.grade .ok[aria-pressed="true"]{background:var(--shu);color:var(--sheet)}
.grade .again[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

.stamp{position:absolute;top:10px;right:12px;width:74px;height:74px;pointer-events:none;transform:rotate(-12deg);opacity:0;transition:opacity .25s,transform .25s}
.sheet.done .stamp{opacity:.9;transform:rotate(-8deg)}
.sheet.done .tools{margin-right:72px}

.done-banner{border:1.5px solid var(--shu);background:var(--shu-soft);color:var(--shu);border-radius:12px;padding:12px 16px;font-size:1.05rem;font-weight:600;display:flex;align-items:center;gap:10px}
.done-banner svg{width:40px;height:40px;flex:none}
.done-banner .jp{font-family:var(--f-jp);font-size:1.15rem}
footer{color:var(--muted);font-size:.8rem}

@media (max-width:520px){
  h1{font-size:1.7rem}
  .q-big{font-size:1.7rem}
  .sheet{padding:14px 14px 12px}
  .row-label{display:none}
  .grade{margin-left:0}
}
@media (prefers-reduced-motion:reduce){ .stamp{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-row">
      <h1>手習い帳<small>Japanese handwriting practice · 5 words a day</small></h1>
      <div class="seg" role="group" aria-label="What to write">
        <button id="mode-kanji" data-mode="kanji">Write kanji</button>
        <button id="mode-kana" data-mode="kana">Write kana</button>
      </div>
    </div>
    <div class="datebar">
      <button class="icon-btn" id="prev" aria-label="Previous day"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <span class="date" id="date"></span>
      <button class="icon-btn" id="next" aria-label="Next day"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="text-btn" id="today" hidden>Back to today</button>
      <span class="progress" id="progress"></span>
    </div>
    <div class="week" id="week"></div>
  </header>

  <div id="banner" hidden></div>
  <main id="list" style="display:flex;flex-direction:column;gap:16px"></main>

  <footer>Your handwriting and self-grades are saved only in this browser on this device. Words rotate by date, so everyone sees the same five words on the same day.</footer>
</div>

<script>
// [written form, reading, English meaning, source word (katakana loanwords only)]
const WORDS = [
  ["水","みず","water"],["火","ひ","fire"],["山","やま","mountain"],["川","かわ","river"],["木","き","tree"],
  ["花","はな","flower"],["雨","あめ","rain"],["空","そら","sky"],["海","うみ","sea"],["石","いし","stone"],
  ["人","ひと","person"],["女","おんな","woman"],["男","おとこ","man"],["子供","こども","child"],["友達","ともだち","friend"],
  ["先生","せんせい","teacher"],["学生","がくせい","student"],["学校","がっこう","school"],["会社","かいしゃ","company"],["病院","びょういん","hospital"],
  ["駅","えき","station"],["電車","でんしゃ","train"],["車","くるま","car"],["自転車","じてんしゃ","bicycle"],["道","みち","road"],
  ["店","みせ","shop"],["家","いえ","house"],["部屋","へや","room"],["本","ほん","book"],["新聞","しんぶん","newspaper"],
  ["手紙","てがみ","letter"],["電話","でんわ","telephone"],["時計","とけい","clock; watch"],["傘","かさ","umbrella"],["机","つくえ","desk"],
  ["椅子","いす","chair"],["窓","まど","window"],["門","もん","gate"],["猫","ねこ","cat"],["犬","いぬ","dog"],
  ["鳥","とり","bird"],["魚","さかな","fish"],["肉","にく","meat"],["野菜","やさい","vegetables"],["果物","くだもの","fruit"],
  ["卵","たまご","egg"],["牛乳","ぎゅうにゅう","milk"],["お茶","おちゃ","tea"],["ご飯","ごはん","rice; meal"],["朝","あさ","morning"],
  ["昼","ひる","noon"],["夜","よる","night"],["今日","きょう","today"],["明日","あした","tomorrow"],["昨日","きのう","yesterday"],
  ["毎日","まいにち","every day"],["時間","じかん","time"],["春","はる","spring"],["夏","なつ","summer"],["秋","あき","autumn"],
  ["冬","ふゆ","winter"],["天気","てんき","weather"],["目","め","eye"],["耳","みみ","ear"],["口","くち","mouth"],
  ["手","て","hand"],["足","あし","foot; leg"],["頭","あたま","head"],["体","からだ","body"],["名前","なまえ","name"],
  ["言葉","ことば","word; language"],["仕事","しごと","work; job"],["休み","やすみ","holiday; break"],["旅行","りょこう","travel"],["写真","しゃしん","photo"],
  ["映画","えいが","movie"],["音楽","おんがく","music"],["大きい","おおきい","big"],["小さい","ちいさい","small"],["高い","たかい","tall; expensive"],
  ["安い","やすい","cheap"],["新しい","あたらしい","new"],["古い","ふるい","old (things)"],["暑い","あつい","hot (weather)"],["寒い","さむい","cold (weather)"],
  ["楽しい","たのしい","fun; enjoyable"],["食べる","たべる","to eat"],["飲む","のむ","to drink"],["見る","みる","to see; to watch"],["聞く","きく","to listen; to ask"],
  ["読む","よむ","to read"],["書く","かく","to write"],["話す","はなす","to speak"],["行く","いく","to go"],["来る","くる","to come"],
  ["帰る","かえる","to go home"],["買う","かう","to buy"],["歩く","あるく","to walk"],["寝る","ねる","to sleep"],["起きる","おきる","to wake up"],
  ["コーヒー","コーヒー","coffee","coffee"],["パン","パン","bread","pão (Portuguese)"],["テレビ","テレビ","TV","television"],["カメラ","カメラ","camera","camera"],
  ["ホテル","ホテル","hotel","hotel"],["ノート","ノート","notebook","notebook"],["ペン","ペン","pen","pen"],["バス","バス","bus","bus"],
  ["タクシー","タクシー","taxi","taxi"],["レストラン","レストラン","restaurant","restaurant"],
];
const PER_DAY = 5, ROWS = 2;
const WEEKDAY = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTH = ["January","February","March","April","May","June","July","August","September","October","November","December"];

// Fixed shuffled order: no repeats within a cycle, which lasts about 23 days
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ORDER = (() => { const r = mulberry32(5150), o = WORDS.map((_, i) => i);
  for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; } return o; })();

const pad = n => String(n).padStart(2, "0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dayIndex = d => Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const wordsFor = d => { const s = dayIndex(d) * PER_DAY; return Array.from({ length: PER_DAY }, (_, i) => ORDER[(s + i) % ORDER.length]); };
const isKatakana = w => !!w[3];

// Storage (this browser only)
const STORE = "jp-handwriting-v1";
let state = { mode: "kanji", days: {} };
try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && s.days) state = Object.assign(state, s); } catch (e) {}
let saveTimer;
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(() => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }, 300); }
const dayData = k => state.days[k] || (state.days[k] = { grades: {}, strokes: {} });
const dayStatus = d => { const k = keyOf(d), dd = state.days[k]; if (!dd) return 0;
  const ok = wordsFor(d).filter(i => dd.grades[i] === "ok").length; return ok === PER_DAY ? 2 : (ok || Object.keys(dd.strokes).length ? 1 : 0); };

// Hanamaru (the teacher's "well done" flower circle)
function hanamaru() {
  let outer = "", inner = "";
  for (let t = 0; t <= 720; t++) { const a = t / 720 * Math.PI * 2, r = 40 + 5 * Math.sin(a * 9);
    outer += (t ? "L" : "M") + (50 + r * Math.cos(a)).toFixed(2) + " " + (50 + r * Math.sin(a)).toFixed(2); }
  for (let t = 0; t <= 400; t++) { const a = t / 400 * Math.PI * 5, r = 4 + t / 400 * 26;
    inner += (t ? "L" : "M") + (50 + r * Math.cos(a)).toFixed(2) + " " + (50 + r * Math.sin(a)).toFixed(2); }
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="${outer}" fill="none" stroke="var(--shu)" stroke-width="3.2" stroke-linejoin="round"/><path d="${inner}" fill="none" stroke="var(--shu)" stroke-width="3.2" stroke-linecap="round"/></svg>`;
}
const HANAMARU = hanamaru();

// Handwriting box
const boxes = new Set();
function makeBox(ghostChar, strokes, onCommit) {
  const el = document.createElement("div"); el.className = "box";
  const g = document.createElement("span"); g.className = "ghost"; g.textContent = ghostChar || ""; g.hidden = true;
  const cv = document.createElement("canvas"); el.append(g, cv);
  const ctx = cv.getContext("2d");
  const api = { el, ghost: g, strokes, redraw };
  let cur = null;

  function width(p) { return cv.width * 0.05 * (0.55 + 0.9 * p); }
  function seg(a, b) {
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--pen").trim() || "#1e2433";
    ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = width((a[2] + b[2]) / 2);
    ctx.beginPath(); ctx.moveTo(a[0] * cv.width, a[1] * cv.height); ctx.lineTo(b[0] * cv.width, b[1] * cv.height); ctx.stroke();
  }
  function drawStroke(s) { if (s.length === 1) seg(s[0], s[0]); for (let i = 1; i < s.length; i++) seg(s[i - 1], s[i]); }
  function redraw() {
    const r = el.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    ctx.clearRect(0, 0, cv.width, cv.height); api.strokes.forEach(drawStroke);
  }
  function pt(e) { const r = cv.getBoundingClientRect();
    const p = e.pointerType === "pen" ? (e.pressure || 0.5) : 0.5;
    return [+((e.clientX - r.left) / r.width).toFixed(3), +((e.clientY - r.top) / r.height).toFixed(3), +p.toFixed(2)]; }
  cv.addEventListener("pointerdown", e => { if (e.button > 0) return; e.preventDefault(); cv.setPointerCapture(e.pointerId);
    cur = [pt(e)]; seg(cur[0], cur[0]); });
  cv.addEventListener("pointermove", e => { if (!cur) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of (evs.length ? evs : [e])) { const p = pt(ev), last = cur[cur.length - 1];
      if (Math.abs(p[0] - last[0]) + Math.abs(p[1] - last[1]) < 0.004) continue; cur.push(p); seg(last, p); } });
  const end = () => { if (!cur) return; api.strokes.push(cur); cur = null; onCommit(api); };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
  new ResizeObserver(redraw).observe(el);
  boxes.add(api);
  return api;
}

// Speech
const canSpeak = "speechSynthesis" in window;
function speak(text) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "ja-JP"; u.rate = 0.85;
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith("ja")); if (v) u.voice = v; speechSynthesis.speak(u); } catch (e) {} }

// UI
let current = new Date(); current = new Date(current.getFullYear(), current.getMonth(), current.getDate());
const $ = id => document.getElementById(id);

function promptFor(w) {
  const [hyoki, kana, en, src] = w;
  if (isKatakana(w)) return { ask: "Write it in katakana", big: en, mean: src === en ? "Loanword" : `Loanword from “${src}”`, target: hyoki };
  if (state.mode === "kana") return { ask: "Write the reading in hiragana", big: hyoki, mean: en, target: kana };
  return { ask: "Write it in kanji", big: kana, mean: en, target: hyoki };
}

function renderSheet(wi, n, dd) {
  const w = WORDS[wi], p = promptFor(w), chars = Array.from(p.target);
  const skey = `${wi}:${p.target}`;
  const saved = dd.strokes[skey] || [];
  const sheet = document.createElement("section"); sheet.className = "sheet";
  sheet.innerHTML = `
    <div class="stamp">${HANAMARU}</div>
    <div class="q-head">
      <div class="q-main">
        <span class="q-no">QUESTION ${n} OF ${PER_DAY}</span>
        <span class="q-ask">${p.ask} · ${chars.length} character${chars.length > 1 ? "s" : ""}</span>
        <div class="q-big"><span>${p.big}</span>${canSpeak ? `<button class="speak" aria-label="Play pronunciation"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg></button>` : ""}</div>
        <span class="q-mean">${p.mean}</span>
      </div>
      <div class="tools">
        <button class="tool" data-act="hint" aria-pressed="false">Trace</button>
        <button class="tool" data-act="undo">Undo</button>
        <button class="tool" data-act="clear">Clear</button>
        <button class="tool" data-act="reveal" aria-pressed="false">Check answer</button>
      </div>
    </div>
    <div class="rows"></div>
    <div class="answer" hidden>
      <span class="a-word">${w[0] !== w[1] ? `<ruby>${w[0]}<rt>${w[1]}</rt></ruby>` : w[0]}</span>
      <span class="a-meta">${w[2]}${w[3] && w[3] !== w[2] ? `<br>from “${w[3]}”` : ""}</span>
      <div class="grade">
        <button class="ok" aria-pressed="false">○ Got it</button>
        <button class="again" aria-pressed="false">△ Practice again</button>
      </div>
    </div>`;

  const rowsEl = sheet.querySelector(".rows"), history = [], api = [];
  const commit = b => { history.push(b); dd.strokes[skey] = api.map(a => a.strokes); save(); renderHeader(); };
  for (let r = 0; r < ROWS; r++) {
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = `<span class="row-label">${r === 0 ? "Practice" : "Recall"}</span><div class="boxes"></div>`;
    const bx = row.querySelector(".boxes");
    chars.forEach((c, i) => { const idx = r * chars.length + i;
      const b = makeBox(r === 0 ? c : "", (saved[idx] || []).slice(), commit); api.push(b); bx.append(b.el); });
    rowsEl.append(row);
  }

  const answer = sheet.querySelector(".answer"), ok = sheet.querySelector(".ok"), again = sheet.querySelector(".again");
  const reflectGrade = () => { const g = dd.grades[wi];
    ok.setAttribute("aria-pressed", g === "ok"); again.setAttribute("aria-pressed", g === "again");
    sheet.classList.toggle("done", g === "ok"); if (g) { answer.hidden = false; sheet.querySelector('[data-act="reveal"]').setAttribute("aria-pressed", "true"); } };
  const setGrade = g => { dd.grades[wi] = dd.grades[wi] === g ? undefined : g; if (!dd.grades[wi]) delete dd.grades[wi]; save(); reflectGrade(); renderHeader(); };
  ok.onclick = () => setGrade("ok"); again.onclick = () => setGrade("again");

  sheet.querySelector(".tools").addEventListener("click", e => {
    const btn = e.target.closest("button"); if (!btn) return;
    const act = btn.dataset.act;
    if (act === "hint") { const on = btn.getAttribute("aria-pressed") !== "true"; btn.setAttribute("aria-pressed", on); api.forEach(a => a.ghost.hidden = !on); }
    if (act === "undo") { const b = history.pop() || [...api].reverse().find(a => a.strokes.length);
      if (b) { b.strokes.pop(); b.redraw(); dd.strokes[skey] = api.map(a => a.strokes); save(); } }
    if (act === "clear") { api.forEach(a => { a.strokes.length = 0; a.redraw(); }); history.length = 0; delete dd.strokes[skey]; save(); renderHeader(); }
    if (act === "reveal") { const on = btn.getAttribute("aria-pressed") !== "true"; btn.setAttribute("aria-pressed", on); answer.hidden = !on; }
  });
  const sp = sheet.querySelector(".speak"); if (sp) sp.onclick = () => speak(w[1]);
  reflectGrade();
  return sheet;
}

function renderHeader() {
  const today = new Date(), t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  $("date").textContent = `${WEEKDAY[current.getDay()]}, ${MONTH[current.getMonth()]} ${current.getDate()}, ${current.getFullYear()}`;
  $("today").hidden = keyOf(current) === keyOf(t0);
  const dd = state.days[keyOf(current)] || { grades: {} };
  const okN = wordsFor(current).filter(i => dd.grades[i] === "ok").length;
  $("progress").innerHTML = `Done today: <b>${okN}</b> / ${PER_DAY}`;
  const wk = $("week"); wk.innerHTML = "";
  for (let i = 6; i >= 0; i--) {
    const d = addDays(t0, -i), st = dayStatus(d);
    const b = document.createElement("button"); b.className = "day" + (keyOf(d) === keyOf(current) ? " sel" : "");
    b.setAttribute("aria-label", `${MONTH[d.getMonth()]} ${d.getDate()}`);
    b.innerHTML = `<span class="wd">${WEEKDAY[d.getDay()]}</span><span class="dn">${d.getDate()}</span><span class="mk">${st === 2 ? HANAMARU : st === 1 ? '<span class="dot"></span>' : ""}</span>`;
    b.onclick = () => { current = d; render(); };
    wk.append(b);
  }
  const banner = $("banner");
  banner.hidden = okN !== PER_DAY;
  if (okN === PER_DAY) banner.innerHTML = `<div class="done-banner">${HANAMARU}<span><span class="jp">よくできました！</span> Well done, you finished all five words for today.</span></div>`;
}

function render() {
  boxes.clear();
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === state.mode));
  const dd = dayData(keyOf(current)), list = $("list"); list.innerHTML = "";
  wordsFor(current).forEach((wi, i) => list.append(renderSheet(wi, i + 1, dd)));
  renderHeader();
}

document.querySelectorAll(".seg button").forEach(b => b.onclick = () => { state.mode = b.dataset.mode; save(); render(); });
$("prev").onclick = () => { current = addDays(current, -1); render(); };
$("next").onclick = () => { current = addDays(current, 1); render(); };
$("today").onclick = () => { const t = new Date(); current = new Date(t.getFullYear(), t.getMonth(), t.getDate()); render(); };

// Redraw ink in the new color when the theme changes
const redrawAll = () => boxes.forEach(b => b.redraw());
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", redrawAll);
new MutationObserver(redrawAll).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

render();
</script>
</body>
</html>
